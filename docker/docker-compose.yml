name: cleanupy

services:
  ui:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "0.0.0.0:8501:8501"
    volumes:
      - ../log:/log
      - ../src/core/db/temp:/src/core/db/temp

  cron:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile-cron
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ../log:/log
      - ../src/core/db/temp:/src/core/db/temp

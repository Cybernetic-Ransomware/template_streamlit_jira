name: Project snaps

services:
  ui:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "0.0.0.0:8501:8501"
    volumes:
      - log-data:/log
      - db-data:/src/core/db/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  cron:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile-cron
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/
    env_file:
      - .env
    depends_on:
      ui:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - log-data:/log
      - db-data:/src/core/db/temp

volumes:
  log-data:
  db-data:
